# Shared by the personal and work Macs.
# Anything only one Mac needs goes in config.<env>.toml.

[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["python", "ruby", "node"]

# Defaults outside projects, which pin their own versions in .node-version etc.
# Loose enough to get patch releases, tight enough to never jump a minor/major.
[tools]
node = "lts"
python = "3.14"
ruby = "3.4"
pnpm = "12"

[bootstrap.brew]
# Bring apps installed by hand under Homebrew instead of failing on them
adopt = true

[bootstrap.packages]
# Basic tools
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-lfs" = "latest"
"brew:gitleaks" = "latest"
# claude/statusline.sh reads Claude Code's status JSON with it
"brew:jq" = "latest"
"brew:just" = "latest"
"brew:lazygit" = "latest"
"brew:sheldon" = "latest"
"brew:shellcheck" = "latest"
"brew:sops" = "latest"
"brew:starship" = "latest"

# Apps
# SSH agent that ssh/config sends every host to
"brew-cask:bitwarden" = "latest"
"brew-cask:ghostty" = "latest"

# Font used by ghostty/config. Not font-biz-udgothic: that cask clones all
# of google/fonts (several GB) and fails partway.
"brew-cask:font-udev-gothic-nf" = "latest"

# App Store
"brew:mas" = "latest"
"mas:497799835" = "latest" # Xcode

[dotfiles]
"~/.gitconfig" = { source = "~/development/config-files/.gitconfig" }
"~/.config/git/ignore" = { source = "~/development/config-files/git/ignore" }
"~/Library/Application Support/lazygit/config.yml" = { source = "~/development/config-files/lazygit/config.yml" }
"~/.zshrc" = { source = "~/development/config-files/.zshrc" }
"~/.config/sheldon/plugins.toml" = { source = "~/development/config-files/sheldon/plugins.toml" }
"~/.config/starship.toml" = { source = "~/development/config-files/starship/starship.toml" }
"~/.config/ghostty/config" = { source = "~/development/config-files/ghostty/config" }
"~/.vimrc" = { source = "~/development/config-files/.vimrc" }
"~/.claude/CLAUDE.md" = { source = "~/development/config-files/claude/CLAUDE.md" }
"~/.claude/statusline.sh" = { source = "~/development/config-files/claude/statusline.sh" }
# Claude Code and Orca rewrite settings.json: merge in the shared keys, keep the rest
"~/.claude/settings.json/shared" = { source = "~/development/config-files/claude/settings.json", merge = true }
"~/.codex/AGENTS.md" = { source = "~/development/config-files/codex/AGENTS.md" }
"~/.codex/keybindings.json" = { source = "~/development/config-files/codex/keybindings.json" }
# Codex writes paths and MCP servers into config.toml: merge in [desktop] only
"~/.codex/config.toml/shared" = { source = "~/development/config-files/codex/config.toml", merge = true }
