# Shared by every Mac, the shop one included: the shell, git, the terminal, a few apps and the
# macOS settings. What only the dev Macs (personal and work) need goes in config.dev.toml, and
# what only one Mac needs in config.<env>.toml.

# The version these files were tested with: dotfile merges are recent.
min_version = "2026.10.24"

[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["python", "ruby", "node"]

[bootstrap.brew]
# Bring apps installed by hand under Homebrew instead of failing on them
adopt = true

[bootstrap.packages]
# Basic tools
"brew:fzf" = "latest"
# .gitconfig takes GitHub's HTTPS credentials from it
"brew:gh" = "latest"
# Newer than the git in the Xcode Command Line Tools
"brew:git" = "latest"
# .gitconfig (and lazygit, on the dev Macs) shows diffs through it
"brew:git-delta" = "latest"
# Touch ID for sudo also inside terminals Orca runs (README.md has the one-time setup)
"brew:pam-reattach" = "latest"
"brew:ripgrep" = "latest"
"brew:sheldon" = "latest"
"brew:starship" = "latest"

# Apps
# SSH agent that ssh/config sends every host to
"brew-cask:bitwarden" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:keka" = "latest"
"brew-cask:raycast" = "latest"
# These run a .pkg installer, which may ask for an admin password
"brew-cask:google-japanese-ime" = "latest"
"brew-cask:zoom" = "latest"

# Font used by ghostty/config and vscode/settings.json. Not font-biz-udgothic: that cask clones all
# of google/fonts (several GB) and fails partway.
"brew-cask:font-udev-gothic-nf" = "latest"

# App Store: the apps themselves are in config.dev.toml and config.<env>.toml
"brew:mas" = "latest"

[dotfiles]
"~/.gitconfig" = { source = "~/development/config-files/.gitconfig" }
"~/.config/git/ignore" = { source = "~/development/config-files/git/ignore" }
"~/.zshrc" = { source = "~/development/config-files/.zshrc" }
"~/.config/sheldon/plugins.toml" = { source = "~/development/config-files/sheldon/plugins.toml" }
"~/.config/starship.toml" = { source = "~/development/config-files/starship/starship.toml" }
"~/.config/ghostty/config" = { source = "~/development/config-files/ghostty/config" }
"~/.vimrc" = { source = "~/development/config-files/.vimrc" }

# macOS settings, as this Mac already had them unless noted.
[bootstrap.macos.defaults.NSGlobalDomain]
# Floats, as macOS stores them (it turns even `defaults write -int` into one): a value counts as
# set only when its type matches, so [bootstrap.macos.keyboard], which writes integers, rewrote
# them every run. Lower is faster and shorter.
KeyRepeat = 2.0
InitialKeyRepeat = 15.0
NSAutomaticCapitalizationEnabled = false
# Pasted code and commands keep their straight quotes and double hyphens
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
# A float: mise writes the type it reads
"com.apple.trackpad.scaling" = 3.0

# Tap to click, for the trackpad and the Bluetooth one
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true

# Show hidden files, in list view
[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
FXPreferredViewStyle = "Nlsv"
