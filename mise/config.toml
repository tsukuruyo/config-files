# Shared by the personal and work Macs.
# Anything only one Mac needs goes in config.<env>.toml.

# The version these files were tested with: dotfile merges are recent.
min_version = "2026.10.24"

[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["python", "ruby", "node"]

# Defaults outside projects, which pin their own versions in .node-version etc.
# Loose enough to get patch releases, tight enough to never jump a minor/major.
[tools]
node = "lts"
python = "3.14"
ruby = "3.4"
pnpm = "12"

[bootstrap.brew]
# Bring apps installed by hand under Homebrew instead of failing on them
adopt = true

[bootstrap.packages]
# Basic tools
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
# Newer than the git in the Xcode Command Line Tools
"brew:git" = "latest"
# .gitconfig and lazygit show diffs through it
"brew:git-delta" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-lfs" = "latest"
"brew:gitleaks" = "latest"
# claude/statusline.sh reads Claude Code's status JSON with it
"brew:jq" = "latest"
"brew:just" = "latest"
"brew:lazygit" = "latest"
# Touch ID for sudo also inside terminals Orca runs (README.md has the one-time setup)
"brew:pam-reattach" = "latest"
"brew:ripgrep" = "latest"
"brew:sheldon" = "latest"
"brew:shellcheck" = "latest"
"brew:sops" = "latest"
"brew:starship" = "latest"

# Apps
# SSH agent that ssh/config sends every host to
"brew-cask:bitwarden" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:arc" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:google-gemini" = "latest"
"brew-cask:jetbrains-toolbox" = "latest"
"brew-cask:keka" = "latest"
"brew-cask:linear" = "latest"
"brew-cask:ngrok" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:pearcleaner" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:visual-studio-code" = "latest"
# These run a .pkg installer, which may ask for an admin password
"brew-cask:google-drive" = "latest"
"brew-cask:google-japanese-ime" = "latest"
"brew-cask:tailscale-app" = "latest"
"brew-cask:zoom" = "latest"
"brew-cask:libreoffice" = "latest"

# Font used by ghostty/config and vscode/settings.json. Not font-biz-udgothic: that cask clones all
# of google/fonts (several GB) and fails partway.
"brew-cask:font-udev-gothic-nf" = "latest"

# App Store
"brew:mas" = "latest"
"mas:497799835" = "latest" # Xcode
"mas:937984704" = "latest" # Amphetamine
"mas:1342896380" = "latest" # Hex Fiend
"mas:1452453066" = "latest" # Hidden Bar
"mas:1532419400" = "latest" # MeetingBar
"mas:1518036000" = "latest" # Sequel Ace
"mas:457622435" = "latest" # Yoink

[dotfiles]
"~/.gitconfig" = { source = "~/development/config-files/.gitconfig" }
"~/.config/git/ignore" = { source = "~/development/config-files/git/ignore" }
"~/Library/Application Support/lazygit/config.yml" = { source = "~/development/config-files/lazygit/config.yml" }
"~/.zshrc" = { source = "~/development/config-files/.zshrc" }
"~/.config/sheldon/plugins.toml" = { source = "~/development/config-files/sheldon/plugins.toml" }
"~/.config/starship.toml" = { source = "~/development/config-files/starship/starship.toml" }
"~/.config/ghostty/config" = { source = "~/development/config-files/ghostty/config" }
"~/.vimrc" = { source = "~/development/config-files/.vimrc" }
"~/Library/Application Support/Code/User/settings.json" = { source = "~/development/config-files/vscode/settings.json" }
"~/Library/Application Support/Code/User/keybindings.json" = { source = "~/development/config-files/vscode/keybindings.json" }
"~/.claude/CLAUDE.md" = { source = "~/development/config-files/claude/CLAUDE.md" }
"~/.claude/statusline.sh" = { source = "~/development/config-files/claude/statusline.sh" }
"~/.claude/keybindings.json" = { source = "~/development/config-files/claude/keybindings.json" }
# Claude Code and Orca rewrite settings.json: merge in the shared keys, keep the rest
"~/.claude/settings.json/shared" = { source = "~/development/config-files/claude/settings.json", merge = true }
"~/.codex/AGENTS.md" = { source = "~/development/config-files/codex/AGENTS.md" }
"~/.codex/keybindings.json" = { source = "~/development/config-files/codex/keybindings.json" }
# Codex writes paths and MCP servers into config.toml: merge in [desktop] only
"~/.codex/config.toml/shared" = { source = "~/development/config-files/codex/config.toml", merge = true }

# macOS settings, as this Mac already had them unless noted.
[bootstrap.macos.defaults.NSGlobalDomain]
# Floats, as macOS stores them: mise compares types and would rewrite an int every run
KeyRepeat = 2.0
InitialKeyRepeat = 15.0
NSAutomaticCapitalizationEnabled = false
# Pasted code and commands keep their straight quotes and double hyphens
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
# A float: mise writes the type it reads
"com.apple.trackpad.scaling" = 3.0

# Tap to click, for the trackpad and the Bluetooth one
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true

# Show hidden files, in list view
[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
FXPreferredViewStyle = "Nlsv"
