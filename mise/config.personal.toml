# Loaded on top of config.toml when miserc.local.toml sets env = ["personal"].

# mise installs .NET with Microsoft's dotnet-install script into one root shared by
# every SDK version listed, and sets DOTNET_ROOT and PATH for it.
[tools]
dotnet = ["10"]

[bootstrap.packages]
# Apps
# Photoshop, Premiere Pro and the other Adobe apps are installed from it
"brew-cask:adobe-creative-cloud" = "latest"
"brew-cask:android-commandlinetools" = "latest"
"brew-cask:comfy" = "latest"
"brew-cask:dockdoor" = "latest"
"brew-cask:epic-games" = "latest"
"brew-cask:godot" = "latest"
# Runs a .pkg installer, which may ask for an admin password
"brew-cask:google-drive" = "latest"
"brew-cask:jetbrains-toolbox" = "latest"
"brew-cask:lm-studio" = "latest"
"brew-cask:obsidian" = "latest"
# Runs a .pkg installer, which may ask for an admin password
"brew-cask:temurin" = "latest"
"brew-cask:unity-hub" = "latest"

# App Store
"mas:1380563956" = "latest" # Dictionaries
"mas:975937182" = "latest" # Fantastical
"mas:539883307" = "latest" # LINE
"mas:905953485" = "latest" # NordVPN
"mas:904280696" = "latest" # Things 3
"mas:585829637" = "latest" # Todoist
"mas:1278508951" = "latest" # Trello
"mas:310633997" = "latest" # WhatsApp
